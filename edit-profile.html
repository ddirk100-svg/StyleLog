    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스타일로그 - 내 정보 수정</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/utils.css?v=8">
    <link rel="stylesheet" href="styles/write.css?v=17">
    <link rel="stylesheet" href="styles/bottom-nav.css?v=4">
    <link rel="stylesheet" href="styles/dialog.css">
    <link rel="stylesheet" href="styles/require-birthdate.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="scripts/config.js?v=6"></script>

<body class="has-bottom-nav">
    <div class="container" id="editProfileView">
        <header class="write-header">
            <a href="mypage.html" class="icon-btn cancel-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M19 12H5M12 19l-7-7 7-7"></path>
                </svg>
            </a>
            <h1 class="header-title">내 정보 수정</h1>
            <div style="width: 40px;"></div>
        </header>

        <form class="write-form" id="editProfileForm">
            <div class="form-section">
                <label class="form-label" for="email">이메일</label>
                <input type="email" id="email" class="form-input" readonly>
                <p class="form-hint write-ui-copy">
                    <span class="write-ui-copy__line">이메일은 로그인 식별자예요.</span>
                    <span class="write-ui-copy__line">여기서는 변경할 수 없어요.</span>
                </p>
            </div>
            <div class="form-section">
                <label class="form-label" for="displayName">표시 이름</label>
                <input type="text" id="displayName" class="form-input" placeholder="표시할 이름을 입력하세요" maxlength="30">
            </div>
            <button type="submit" class="btn-primary">저장하기</button>
        </form>
    </div>

    <div data-stylelog-bottom-nav data-active="mypage"></div>

    <script src="scripts/bottom-nav.js?v=1" defer></script>
    <script src="scripts/edit-profile.js"></script>
    <script>
        (async () => {
            try {
                await requireAuth();
                if (typeof initPage === 'function') await initPage();
            } catch (error) {
                console.error('인증 오류:', error);
            }
        })();
    </script>
</body>
</html>
