<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script>if(window.location.hostname.includes('alpha')){document.write('<meta name="robots" content="noindex,nofollow">');}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코디에게 물어보기 - StyleLog</title>
    <link rel="icon" href="img/StyleLog_logo(favicon).png" type="image/png">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/utils.css?v=8">
    <link rel="stylesheet" href="styles/bottom-nav.css">
    <link rel="stylesheet" href="styles/write.css?v=17">
    <link rel="stylesheet" href="styles/assistant.css?v=1">
    <link rel="stylesheet" href="styles/require-birthdate.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="scripts/config.js?v=8"></script>
    <script src="scripts/require-birthdate.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/common.js?v=16"></script>
</head>
<body class="has-bottom-nav assistant-page">
    <div class="container" id="assistantView">
        <header class="write-header">
            <a href="mypage.html" class="icon-btn cancel-btn" aria-label="뒤로">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
            </a>
            <h1 class="header-title">코디에게 물어보기</h1>
            <div style="width:40px" aria-hidden="true"></div>
        </header>

        <p class="assistant-lede write-ui-copy">
            <span class="write-ui-copy__line">내가 남긴 코디 기록만 참고해 답해요.</span>
        </p>

        <div class="assistant-thread" id="assistantThread" aria-live="polite"></div>

        <form class="assistant-compose" id="assistantForm">
            <label class="util-sr-only" for="assistantInput">메시지</label>
            <textarea id="assistantInput" class="assistant-input" rows="2" maxlength="2000" placeholder="예: 오늘 회사인데 좀 추워. 예전에 비슷하게 입었던 거 있어?"></textarea>
            <button type="submit" class="util-btn-primary assistant-send" id="assistantSend">보내기</button>
        </form>
    </div>

    <nav class="bottom-nav" aria-label="주요 메뉴">
        <a href="home.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">홈</span></a>
        <a href="write.html" class="nav-item"><span class="nav-icon">✏️</span><span class="nav-label">작성</span></a>
        <a href="wardrobe.html" class="nav-item"><span class="nav-icon">👕</span><span class="nav-label">옷장</span></a>
        <a href="mypage.html" class="nav-item active"><span class="nav-icon">👤</span><span class="nav-label">마이</span></a>
    </nav>

    <script src="scripts/style-assistant-client.js?v=1" defer></script>
    <script src="scripts/assistant.js?v=2" defer></script>

</html>
