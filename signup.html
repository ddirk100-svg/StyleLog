<!DOCTYPE html>
<html lang="ko">
<head>
    <script>if(window.location.hostname.includes('alpha')){document.write('<meta name="robots" content="noindex,nofollow">');}</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4JCJ9BQ674"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-4JCJ9BQ674');
    </script>
    <link rel="icon" href="/img/StyleLog_logo(favicon).png" type="image/png" sizes="48x48">
    <link rel="apple-touch-icon" href="/img/StyleLog_logo(favicon).png">
    <title>회원가입 - StyleLog</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              deep: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' }
            },
            fontFamily: { sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'Malgun Gothic', 'sans-serif'] }
          }
        }
      }
    </script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="scripts/config.js?v=6"></script>
    <style>
      body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; letter-spacing: -0.02em; }
      .form-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
    </style>
</head>
<body class="bg-white text-gray-900 antialiased min-h-screen">
    <div class="min-h-screen flex flex-col">
        <!-- Header: 로그인과 동일 -->
        <header class="bg-white/95 backdrop-blur-md border-b border-gray-100">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 flex justify-between items-center h-16">
                <a href="landing.html" class="flex items-center">
                    <img src="img/StyleLog_logo(Eng).png" alt="StyleLog" class="h-10 w-auto" width="120" height="40" loading="eager" decoding="async">
                </a>
                <div class="flex gap-3">
                    <a href="login.html" class="px-4 py-2 text-sm font-semibold text-deep-600 border-2 border-deep-600 rounded-lg hover:bg-deep-50 transition-colors">로그인</a>
                    <span class="px-4 py-2 text-sm font-semibold text-deep-600 bg-deep-50 rounded-lg">회원가입</span>
                </div>
            </div>
        </header>

        <!-- 메인: 회원가입 폼 -->
        <main class="flex-1 flex items-center justify-center px-4 py-16 sm:py-24 bg-gradient-to-b from-white via-deep-50/20 to-white">
            <div class="w-full max-w-md">
                <div class="text-center mb-10">
                    <p class="text-sm font-semibold text-deep-600 mb-2">나만의 패션 일기</p>
                    <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">함께 시작해요</h1>
                    <p class="text-gray-600 mt-2">생년월일 확인 후 이메일·비밀번호로 가입하세요<br><span class="text-gray-500 text-sm">만 14세 미만은 가입할 수 없습니다.</span></p>
                </div>

                <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-8 sm:p-10">
                    <form id="signupForm" class="space-y-6">
                        <div>
                            <label for="email" class="block text-sm font-semibold text-gray-800 mb-2">이메일</label>
                            <input type="email" id="email" name="email" placeholder="example@email.com" required autocomplete="email"
                                class="form-input w-full px-4 py-3.5 border-2 border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none transition-colors">
                        </div>
                        <div>
                            <label for="password" class="block text-sm font-semibold text-gray-800 mb-2">비밀번호</label>
                            <input type="password" id="password" name="password" placeholder="6자 이상 입력하세요" required autocomplete="new-password" minlength="6"
                                class="form-input w-full px-4 py-3.5 border-2 border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none transition-colors">
                        </div>
                        <div>
                            <label for="passwordConfirm" class="block text-sm font-semibold text-gray-800 mb-2">비밀번호 확인</label>
                            <input type="password" id="passwordConfirm" name="passwordConfirm" placeholder="비밀번호를 다시 입력하세요" required autocomplete="new-password" minlength="6"
                                class="form-input w-full px-4 py-3.5 border-2 border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none transition-colors">
                        </div>
                        <div>
                            <label for="birthDate" class="block text-sm font-semibold text-gray-800 mb-2">생년월일</label>
                            <input type="date" id="birthDate" name="birthDate" required autocomplete="bday"
                                class="form-input w-full px-4 py-3.5 border-2 border-gray-200 rounded-xl text-gray-900 focus:outline-none transition-colors">
                            <p id="birthDateHint" class="text-xs text-gray-500 mt-1.5">가입일 기준 만 14세 이상만 가입 가능합니다.</p>
                        </div>

                        <p class="text-xs text-gray-500 text-center leading-relaxed -mt-1">
                            회원가입 시 <a href="terms.html" class="text-deep-600 underline hover:no-underline">이용약관</a> 및 <a href="privacy.html" class="text-deep-600 underline hover:no-underline">개인정보처리방침</a>에 동의하는 것으로 간주합니다.
                        </p>

                        <button type="submit" id="signupBtn" class="w-full py-3.5 bg-deep-600 text-white font-semibold rounded-xl hover:bg-deep-700 transition-all hover:shadow-lg disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                            회원가입
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
                        </button>
                    </form>

                    <div class="relative my-8">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-200"></div>
                        </div>
                        <div class="relative flex justify-center">
                            <span class="px-4 bg-white text-sm text-gray-500">또는</span>
                        </div>
                    </div>

                    <a href="login.html" class="block w-full py-3.5 text-center border-2 border-deep-600 text-deep-600 font-semibold rounded-xl hover:bg-deep-50 transition-colors">
                        로그인
                    </a>

                    <div id="errorMessage" class="mt-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm text-center hidden leading-relaxed"></div>
                    <div id="successMessage" class="mt-6 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm text-center hidden leading-relaxed"></div>
                </div>

                <p class="text-center text-sm text-gray-500 mt-8">
                    <a href="landing.html" class="text-deep-600 hover:underline">← 랜딩으로 돌아가기</a>
                </p>
            </div>
        </main>

        <footer class="mt-auto border-t border-gray-100 py-6 px-4 text-center text-sm text-gray-500" aria-label="법적 고지">
            <nav class="flex flex-wrap justify-center items-center gap-x-4 gap-y-2 mb-2">
                <a href="terms.html" class="hover:text-deep-600">이용약관</a>
                <span class="text-gray-300">·</span>
                <a href="privacy.html" class="hover:text-deep-600">개인정보처리방침</a>
            </nav>
            <p>© 2026 StyleLog</p>
        </footer>
    </div>

    <script src="scripts/auth.js"></script>
    <script>
        function signupDateToYMD(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function signupSetupBirthLimits() {
            const inp = document.getElementById('birthDate');
            if (!inp) return;
            const now = new Date();
            const maxD = new Date(now.getFullYear() - 14, now.getMonth(), now.getDate());
            const minD = new Date(now.getFullYear() - 120, now.getMonth(), now.getDate());
            inp.max = signupDateToYMD(maxD);
            inp.min = signupDateToYMD(minD);
        }

        window.addEventListener('load', async () => {
            signupSetupBirthLimits();
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) window.location.href = 'home.html';
        });

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const emailInput = document.getElementById('email').value;
            const email = emailInput.toLowerCase().trim();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;
            const birthRaw = document.getElementById('birthDate').value.trim();
            const signupBtn = document.getElementById('signupBtn');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');
            errorMessage.textContent = '';
            successMessage.textContent = '';

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                errorMessage.textContent = '올바른 이메일 형식을 입력해주세요.';
                errorMessage.classList.remove('hidden');
                return;
            }
            if (password !== passwordConfirm) {
                errorMessage.textContent = '비밀번호가 일치하지 않습니다.';
                errorMessage.classList.remove('hidden');
                return;
            }
            if (password.length < 6) {
                errorMessage.textContent = '비밀번호는 최소 6자 이상이어야 합니다.';
                errorMessage.classList.remove('hidden');
                return;
            }
            if (!birthRaw || !/^\d{4}-\d{2}-\d{2}$/.test(birthRaw)) {
                errorMessage.textContent = '생년월일을 올바르게 선택해 주세요.';
                errorMessage.classList.remove('hidden');
                return;
            }

            signupSetupBirthLimits();
            const birthInput = document.getElementById('birthDate');
            const maxAllowed = birthInput.max;
            const minAllowed = birthInput.min;
            if (birthRaw > maxAllowed) {
                errorMessage.textContent = '만 14세 미만은 가입할 수 없습니다.';
                errorMessage.classList.remove('hidden');
                return;
            }
            if (birthRaw < minAllowed) {
                errorMessage.textContent = '생년월일을 다시 확인해 주세요.';
                errorMessage.classList.remove('hidden');
                return;
            }

            signupBtn.disabled = true;
            signupBtn.textContent = '가입 중...';

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email, password,
                    options: {
                        emailRedirectTo: window.location.origin + '/login.html',
                        data: { birth_date: birthRaw }
                    }
                });

                if (error) throw error;

                if (data.user && (!data.user.identities || data.user.identities.length === 0)) {
                    throw new Error('User already registered');
                }

                if (typeof gtag === 'function') gtag('event', 'sign_up');

                successMessage.innerHTML = `
                    <strong>회원가입이 완료되었습니다! 🎉</strong><br><br>
                    <strong class="text-red-600">⚠️ 이메일 인증 필요</strong><br>
                    <strong>${email}</strong> 메일함을 확인하여 인증 링크를 클릭해주세요.<br><br>
                    <span class="text-gray-500">3초 후 로그인 페이지로 이동합니다...</span>
                `;
                successMessage.classList.remove('hidden');

                setTimeout(() => { window.location.href = 'login.html'; }, 3000);

            } catch (error) {
                if (error.message.includes('User already registered') || error.message.includes('already been registered') || error.message.includes('duplicate') || error.message.includes('already exists')) {
                    errorMessage.innerHTML = `<strong>이미 가입된 이메일입니다</strong><br>${email}은(는) 이미 사용 중입니다.<br><a href="login.html" class="text-deep-600 underline">로그인</a>하세요.`;
                } else if (error.message.includes('Password should be at least 6 characters')) {
                    errorMessage.textContent = '비밀번호는 최소 6자 이상이어야 합니다.';
                } else if (error.message.includes('Invalid email')) {
                    errorMessage.textContent = '올바른 이메일 형식을 입력해주세요.';
                } else {
                    errorMessage.textContent = '회원가입에 실패했습니다. ' + (error?.message?.slice(0, 60) || '');
                }
                errorMessage.classList.remove('hidden');
                signupBtn.disabled = false;
                signupBtn.textContent = '회원가입';
            }
        });
    </script>
</body>
</html>
