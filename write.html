<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4JCJ9BQ674"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-4JCJ9BQ674');
    </script>
    <link rel="icon" href="img/StyleLog_logo(favicon).png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스타일로그 - 작성</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="styles/variables.css?v=9">
    <link rel="stylesheet" href="styles/utils.css?v=9">
    <link rel="stylesheet" href="styles/write.css?v=28">
    <link rel="stylesheet" href="styles/dialog.css">
    <link rel="stylesheet" href="styles/bottom-nav.css?v=4">
    <link rel="stylesheet" href="styles/require-birthdate.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
</head>
<body class="has-bottom-nav">
    <!-- 작성 화면 -->
    <div class="container" id="writeView">

        <!-- 헤더 -->
        <header class="write-header">
            <button type="button" class="icon-btn cancel-btn" aria-label="뒤로">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M19 12H5M12 19l-7-7 7-7"></path>
                </svg>
            </button>
            <h1 class="header-title">새 기록</h1>
            <button type="button" class="text-btn save-btn" disabled>저장</button>
        </header>

        <!-- 본문 폼 -->
        <form class="write-form" id="writeForm">

            <section class="write-group write-group--required" aria-labelledby="writeGroupRequiredTitle">
                <header class="write-group-header">
                    <span class="write-group-badge write-group-badge--required">필수</span>
                    <div class="write-group-heading">
                        <h2 class="write-group-title" id="writeGroupRequiredTitle">언제, 어떤 날씨였나요</h2>
                        <p class="write-group-desc">날씨는 날짜에 맞춰 자동으로 채워져요.</p>
                    </div>
                </header>
                <div class="write-group-body">
                    <div class="write-when-shell">
                        <div class="write-when-field">
                            <label class="write-when-field-label" for="dateInput">날짜</label>
                            <input type="date" class="write-when-date" id="dateInput" required>
                        </div>
                        <div class="write-when-split" aria-hidden="true"></div>
                        <div class="write-when-field write-when-field--weather">
                            <span class="write-when-field-label">날씨</span>
                            <div class="write-when-weather" id="weatherDisplay">
                                <span class="write-when-weather-icon" id="weatherIconContainer" aria-hidden="true">
                                    <svg class="weather-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></svg>
                                </span>
                                <span class="write-when-weather-text">
                                    <span class="write-when-weather-name" id="weatherName">흐림</span>
                                    <span class="write-when-temp-range temp-range" id="tempRange" style="display: none;">
                                        <span class="temp-max">최고 --°</span>
                                        <span class="temp-min">최저 --°</span>
                                    </span>
                                </span>
                            </div>
                            <span id="weatherTemp" class="visually-hidden" aria-hidden="true"></span>
                            <input type="hidden" id="weatherInput" name="weather" required>
                            <input type="hidden" id="weatherTempInput" name="weather_temp">
                            <input type="hidden" id="weatherDescInput" name="weather_description">
                        </div>
                    </div>
                    <div class="form-section form-section--in-group form-section--quiet">
                        <label class="form-label">옷차림 체감</label>
                        <div class="weather-fit-btns" id="weatherFitBtns" role="group" aria-label="옷차림 체감">
                            <button type="button" class="weather-fit-btn" data-value="cold">추움</button>
                            <button type="button" class="weather-fit-btn active" data-value="good">적당</button>
                            <button type="button" class="weather-fit-btn" data-value="hot">더움</button>
                        </div>
                        <input type="hidden" id="weatherFitInput" name="weather_fit" value="good">
                    </div>
                </div>
            </section>

            <section class="write-group write-group--optional" aria-labelledby="writeGroupOptionalTitle">
                <header class="write-group-header">
                    <span class="write-group-badge write-group-badge--optional">선택</span>
                    <div class="write-group-heading">
                        <h2 class="write-group-title" id="writeGroupOptionalTitle">더 남기기</h2>
                    </div>
                </header>
                <div class="write-group-body">
                    <div class="form-section form-section--in-group">
                        <label class="form-label">코디 사진</label>
                        <div class="photo-upload-area" id="photoUploadArea">
                            <input type="file" id="photoInput" accept="image/*" multiple style="display: none;">
                            <button type="button" class="upload-btn" onclick="document.getElementById('photoInput').click()">
                                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                    <polyline points="21 15 16 10 5 21"></polyline>
                                </svg>
                                <span>사진 추가</span>
                            </button>
                            <p class="photo-reorder-hint" id="photoReorderHint" style="display: none;">끌어다 놓으면 순서가 바뀌어요.</p>
                            <div class="photo-preview-list" id="photoPreviewList"></div>
                        </div>
                    </div>
                    <div class="form-section form-section--in-group form-section--outfit-items">
                        <div class="form-label-row">
                            <label class="form-label" for="outfitItemsAddBtn">착장 품목</label>
                            <span class="outfit-items-count-badge" id="outfitItemsCountBadge" aria-live="polite">0개</span>
                        </div>
                        <div class="outfit-items-list-region">
                            <div class="outfit-items-list" id="outfitItemsList"></div>
                        </div>
                        <button type="button" class="outfit-item-add-btn" id="outfitItemsAddBtn">+ 착장 품목 추가</button>
                        <input type="hidden" name="items_json" id="itemsJsonInput" value="[]">
                    </div>
                    <div class="form-section form-section--in-group">
                        <label class="form-label" for="titleInput">제목</label>
                        <input type="text" class="form-input title-input" id="titleInput" placeholder="예: 출근룩, 데이트 코디" maxlength="100">
                    </div>
                    <div class="form-section form-section--in-group">
                        <label class="form-label" for="contentInput">메모</label>
                        <textarea class="form-textarea form-textarea--compact" id="contentInput" placeholder="기분, 장소, 코디 포인트 등" rows="4"></textarea>
                    </div>
                    <div class="form-section form-section--in-group form-section--quiet">
                        <label class="form-label">상황</label>
                        <div class="weather-fit-btns" id="tpoBtns" role="group" aria-label="상황">
                            <button type="button" class="weather-fit-btn" data-value="work">회사</button>
                            <button type="button" class="weather-fit-btn" data-value="daily">일상/데이트</button>
                            <button type="button" class="weather-fit-btn" data-value="travel">여행</button>
                            <button type="button" class="weather-fit-btn" data-value="workout">운동</button>
                            <button type="button" class="weather-fit-btn" data-value="guest">경조사</button>
                        </div>
                    </div>
                </div>
            </section>

        </form>
    </div>

    <div data-stylelog-bottom-nav data-active="write"></div>

    <!-- 옷장에서 착장 품목 선택 -->
    <div class="outfit-category-sheet" id="outfitWardrobePickerSheet" aria-hidden="true">
        <div class="outfit-category-sheet__overlay" id="outfitWardrobePickerOverlay"></div>
        <div class="outfit-category-sheet__panel outfit-wardrobe-picker-panel" role="dialog" aria-labelledby="outfitWardrobePickerTitle" aria-modal="true">
            <div class="outfit-category-sheet__handle"></div>
            <h2 class="outfit-category-sheet__title" id="outfitWardrobePickerTitle">옷장에서 선택</h2>
            <p class="outfit-category-sheet__hint" id="outfitWardrobePickerHint">
                <span class="outfit-hint-line">구분 선택 → 옷 탭으로 넣기</span>
                <span class="outfit-hint-line">연필로 이름 수정 · 다시 탭하면 해제</span>
            </p>
            <input type="search" class="outfit-wardrobe-picker-search" id="outfitWardrobePickerSearch" placeholder="이름 검색" autocomplete="off" enterkeyhint="search">
            <div class="outfit-wardrobe-picker-chips" id="outfitWardrobePickerChips" role="tablist" aria-label="구분 필터"></div>
            <div class="outfit-wardrobe-picker-list" id="outfitWardrobePickerList" role="listbox" aria-label="옷장 목록"></div>
            <p class="outfit-wardrobe-picker-empty" id="outfitWardrobePickerEmpty" hidden>이 구분에 옷이 없어요.</p>
            <button type="button" class="outfit-wardrobe-picker-new-btn" id="outfitWardrobePickerNewBtn">+ 옷장에 새 옷 추가</button>
            <button type="button" class="outfit-category-confirm-btn outfit-wardrobe-picker-done-btn" id="outfitWardrobePickerDoneBtn">선택 완료</button>
        </div>
    </div>

    <!-- 작성 화면 — 옷장에 새 옷 추가 -->
    <div class="outfit-category-sheet" id="writeWardrobeAddSheet" aria-hidden="true">
        <div class="outfit-category-sheet__overlay" id="writeWardrobeAddOverlay"></div>
        <div class="outfit-category-sheet__panel" role="dialog" aria-labelledby="writeWardrobeAddTitle" aria-modal="true">
            <div class="outfit-category-sheet__handle"></div>
            <h2 class="outfit-category-sheet__title" id="writeWardrobeAddTitle">옷장에 새 옷 추가</h2>
            <p class="outfit-category-sheet__hint write-ui-copy">
                <span class="write-ui-copy__line">등록하면 이 코디에</span>
                <span class="write-ui-copy__line">바로 선택할 수 있어요.</span>
            </p>
            <div class="outfit-category-grid" id="writeWardrobeAddGrid"></div>
            <label class="wardrobe-add-label" for="writeWardrobeAddName">이름</label>
            <input type="text" class="wardrobe-add-input" id="writeWardrobeAddName" maxlength="200" placeholder="예: 흰티, 청바지" autocomplete="off">
            <button type="button" class="outfit-category-confirm-btn" id="writeWardrobeAddSubmit">옷장에 넣고 선택</button>
        </div>
    </div>

    <!-- 착장 품목 구분 선택 바텀시트 -->
    <div class="outfit-category-sheet" id="outfitCategorySheet" aria-hidden="true">
        <div class="outfit-category-sheet__overlay" id="outfitCategorySheetOverlay"></div>
        <div class="outfit-category-sheet__panel" role="dialog" aria-labelledby="outfitCategorySheetTitle" aria-modal="true">
            <div class="outfit-category-sheet__handle"></div>
            <h2 class="outfit-category-sheet__title" id="outfitCategorySheetTitle">구분 선택</h2>
            <p class="outfit-category-sheet__hint write-ui-copy" id="outfitCategorySheetHint">
                <span class="write-ui-copy__line">구분을 여러 개 고른 뒤</span>
                <span class="write-ui-copy__line">확인하면 한꺼번에 추가돼요.</span>
            </p>
            <div class="outfit-category-grid" id="outfitCategoryGrid"></div>
            <button type="button" class="outfit-category-confirm-btn" id="outfitCategoryConfirmBtn">확인</button>
        </div>
    </div>

    <!-- 크롭 편집 모달 -->
    <div class="crop-modal" id="cropModal">
        <div class="crop-modal-overlay"></div>
        <div class="crop-modal-content">
            <div class="crop-modal-header">
                <h3>코디 사진 맞추기</h3>
                <button type="button" class="crop-modal-close" id="cropModalClose" aria-label="닫기">×</button>
            </div>
            <div class="crop-modal-body">
                <div class="crop-container">
                    <img id="cropImage" src="" alt="크롭할 이미지">
                </div>
                <p class="crop-modal-hint write-ui-copy">
                    <span class="write-ui-copy__line">박스 안이 그대로 저장돼요.</span>
                    <span class="write-ui-copy__line">드래그·핀치로 맞춘 뒤 적용해 주세요.</span>
                </p>
            </div>
            <div class="crop-modal-footer">
                <button type="button" class="crop-cancel-btn" id="cropCancelBtn">취소</button>
                <button type="button" class="crop-apply-btn" id="cropApplyBtn">적용</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js" defer></script>
    <script src="scripts/config.js?v=7" defer></script>
    <script src="scripts/photo-storage.js" defer></script>
    <script src="scripts/api.js?v=9" defer></script>
    <script src="scripts/require-birthdate.js" defer></script>
    <script src="scripts/auth.js" defer></script>
    <script src="scripts/common.js?v=16" defer></script>
    <script src="scripts/bottom-nav.js?v=1" defer></script>
    <script src="scripts/write.js?v=28" defer></script>
    <script>
        // 페이지 로드 시 인증 체크
        window.addEventListener('DOMContentLoaded', async () => {
            await requireAuth();
        });
    </script>
</body>
</html>
