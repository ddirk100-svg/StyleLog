    <script>
        // 페이지 로드 시 인증 체크
        window.addEventListener('DOMContentLoaded', async () => {
            const authLoading = document.getElementById('authLoading');
            authLoading.style.display = 'flex';

            // 관리자 전용 호스트: 앱 로그인·Supabase 분기와 무관하게 랜딩으로 보내지 않음
            const host = window.location.hostname;
            if (host === 'admin.stylelog.co.kr' || host === 'admin.alpha.stylelog.co.kr') {
                authLoading.style.display = 'none';
                return;
            }

            try {
                // supabaseClient가 초기화되었는지 확인
                if (typeof supabaseClient === 'undefined' || !supabaseClient) {
                    console.error('Supabase 클라이언트가 초기화되지 않았습니다.');
                    window.location.href = 'landing.html';
                    return;
                }
                
                // 로그인 여부 확인
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                
                if (error) {
                    console.error('인증 확인 오류:', error);
                    window.location.href = 'landing.html';
                    return;
                }
                
                if (!session) {
                    // 로그인 안됐으면 랜딩 페이지로
                    window.location.href = 'landing.html';
                    return;
                }

                var ures = await supabaseClient.auth.getUser();
                var userAfter = ures.data && ures.data.user ? ures.data.user : null;
                if (
                    typeof RequireBirthdate !== 'undefined' &&
                    RequireBirthdate.needsBirth(userAfter)
                ) {
                    await RequireBirthdate.showModalAndSave();
                }
                
                // 로그인 됐으면 정상 진행
                authLoading.style.display = 'none';
            } catch (error) {
                console.error('인증 체크 중 오류 발생:', error);
                window.location.href = 'landing.html';
            }
        });
    </script>
