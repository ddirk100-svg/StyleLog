<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4JCJ9BQ674"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-4JCJ9BQ674');

    <link rel="icon" href="img/StyleLog_logo(favicon).png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스타일로그 - 내 옷장</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/write.css?v=10">
    <link rel="stylesheet" href="styles/bottom-nav.css">
    <link rel="stylesheet" href="styles/dialog.css">
    <link rel="stylesheet" href="styles/require-birthdate.css">
    <link rel="stylesheet" href="styles/wardrobe.css?v=7">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="scripts/config.js?v=5"></script>
    <script src="scripts/api.js?v=7"></script>
    <script src="scripts/require-birthdate.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/common.js?v=7"></script>
</head>
<body class="has-bottom-nav">
    <div class="container" id="wardrobeView">
        <header class="write-header">
            <a href="mypage.html" class="icon-btn cancel-btn" aria-label="마이페이지">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M19 12H5M12 19l-7-7 7-7"></path>
                </svg>
            </a>
            <h1 class="header-title">내 옷장</h1>
            <div style="width: 40px;"></div>
        </header>

        <div class="wardrobe-policy-hint" role="note">
            <p><strong>품목명을 수정</strong>하면 지난 착장 기록도 같이 바뀌어요.</p>
            <p><strong>옷장에서 빼두면</strong> 지금 옷장과 작성 시 드롭다운에서 숨겨져요.<br>지난 기록에는 그대로 남아 있어요.</p>
        </div>

        <div class="wardrobe-mode-tabs" role="tablist" aria-label="옷장 보기">
            <button type="button" class="wardrobe-mode-tab is-active" role="tab" id="wardrobeTabCloset" data-mode="closet" aria-selected="true">
                지금 옷장 <span class="wardrobe-mode-count" id="wardrobeCountCloset">0</span>
            </button>
            <button type="button" class="wardrobe-mode-tab" role="tab" id="wardrobeTabAside" data-mode="aside" aria-selected="false">
                빼 둔 옷 모음 <span class="wardrobe-mode-count" id="wardrobeCountAside">0</span>
            </button>
        </div>

        <div class="wardrobe-cat-chips" id="wardrobeCatChips" role="tablist" aria-label="구분"></div>
        <button type="button" class="wardrobe-add-btn" id="wardrobeAddBtn">+ 옷 추가</button>

        <div id="wardrobeActiveList" class="wardrobe-list"></div>
        <p id="wardrobeEmpty" class="wardrobe-empty" hidden>아직 옷이 없어요.</p>
    </div>

    <div class="outfit-category-sheet" id="wardrobeAddSheet" aria-hidden="true">
        <div class="outfit-category-sheet__overlay" id="wardrobeAddSheetOverlay"></div>
        <div class="outfit-category-sheet__panel" role="dialog" aria-labelledby="wardrobeAddSheetTitle" aria-modal="true">
            <div class="outfit-category-sheet__handle"></div>
            <h2 class="outfit-category-sheet__title" id="wardrobeAddSheetTitle">옷 추가</h2>
            <p class="outfit-category-sheet__hint">구분과 이름을 정하면 지금 옷장에 들어가요. 아직 안 입은 옷도 넣어 둘 수 있어요.</p>
            <div class="outfit-category-grid" id="wardrobeAddGrid"></div>
            <label class="wardrobe-add-label" for="wardrobeAddName">이름</label>
            <input type="text" class="wardrobe-add-input" id="wardrobeAddName" maxlength="200" placeholder="예: 흰티, 청바지" autocomplete="off">
            <button type="button" class="outfit-category-confirm-btn" id="wardrobeAddSubmit">옷장에 넣기</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="home.html" class="bottom-nav-item">
            <div class="bottom-nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </div>
            <span class="bottom-nav-label">홈</span>
        </a>
        <a href="write.html" class="bottom-nav-item write-btn">
            <div class="bottom-nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </div>
            <span class="bottom-nav-label">코디 추가</span>
        </a>
        <a href="mypage.html" class="bottom-nav-item active">
            <div class="bottom-nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
            <span class="bottom-nav-label">마이</span>
        </a>
    </nav>

    <script src="scripts/wardrobe.js?v=9"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await requireAuth();
                if (typeof initPage === 'function') await initPage();
            } catch (error) {
                console.error('인증 오류:', error);
            }
        });
    </script>
</body>
</html>
